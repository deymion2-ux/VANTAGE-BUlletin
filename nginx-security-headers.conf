# Inside the nginx location/server that serves VANTAGE Intranet.
# Keep the CSP HTTP header aligned with index.html's defense-in-depth meta CSP.
# Make sure these add_header directives are inherited on all application responses.
add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; object-src 'none'; form-action 'self' https://login.microsoftonline.com; script-src 'self' https://alcdn.msauth.net; style-src 'self'; font-src 'self'; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://*.msauth.net https://*.msftauth.net https://*.microsoftonline.com; img-src 'self' data:; frame-src https://login.microsoftonline.com https://*.microsoftonline.com; frame-ancestors 'none'; upgrade-insecure-requests;" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
